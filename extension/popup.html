<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polite Rewriter</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="wrap">
      <header>
        <h1>Polite Rewriter</h1>
      </header>

      <section class="card auth-card">
        <label>계정</label>
        <div class="account-row">
          <p id="accountSummary" class="sub">Google 계정으로 로그인해 주세요.</p>
          <p id="authStatus" class="mini-chip"></p>
        </div>
        <div class="actions">
          <button id="googleLoginBtn" type="button">Google로 시작</button>
          <button id="logoutBtn" type="button" class="ghost">로그아웃</button>
        </div>
      </section>

      <section class="card plans-card">
        <div class="label-row">
          <label>요금제</label>
          <button id="plansInfoBtn" type="button" class="icon-btn" title="요금제 정책 보기">?</button>
        </div>
        <p id="planSummary" class="sub">로그인하면 현재 플랜 상태를 확인할 수 있습니다.</p>
        <div class="plan-actions-wrap">
          <div class="actions secondary">
            <button id="topupBtn" type="button" class="ghost">10회 추가</button>
            <button id="managePlanBtn" type="button" class="ghost">요금제 변경</button>
          </div>
          <button id="planPreviewOverlayBtn" type="button" class="plan-preview-overlay">요금제 미리보기</button>
        </div>
      </section>

      <section class="card">
        <label for="tone">분위기</label>
        <select id="tone">
          <optgroup label="개인형">
            <option>보통</option>
            <option>친근하게</option>
            <option selected>정중하게</option>
            <option>아주 정중하게</option>
            <option>캐주얼하게</option>
            <option>미안함</option>
            <option>제안함</option>
            <option>사랑함</option>
          </optgroup>
          <optgroup label="비즈니스형">
            <option>공손하지만 단호하게</option>
            <option>보고 요청</option>
            <option>제안서</option>
            <option>일정 변경</option>
            <option>회식 제안</option>
            <option>업무 변경</option>
          </optgroup>
        </select>

        <label for="recipient">보내는 대상</label>
        <select id="recipient">
          <option>상사</option>
          <option>동료</option>
          <option>친구</option>
          <option>학부모</option>
          <option>고객</option>
          <option>거래처</option>
          <option>연인</option>
          <option>가족</option>
          <option selected>기타</option>
        </select>

        <label for="senderRole">본인 역할</label>
        <input id="senderRole" type="text" placeholder="예: 팀원, 자녀 보호자, 담임교사" />

        <label for="originalText">원본 문자</label>
        <textarea id="originalText" rows="6" placeholder="정중하게 바꾸고 싶은 원본 문장을 입력하세요"></textarea>
        <p id="originalTextError" class="field-error"></p>

        <button id="backgroundToggleBtn" type="button" class="inline-toggle">상황 설명 추가</button>
        <div id="backgroundWrap" class="background-wrap hidden">
          <label for="backgroundNote">배경 설명 (선택)</label>
          <textarea id="backgroundNote" rows="3" maxlength="100" placeholder="예: 애칭은 자기야 / 최근 보고 방식 때문에 감정이 상한 상태"></textarea>
          <p id="backgroundNoteMeta" class="helper-text">최대 100자. 참고만 하고 결과문에 직접 인용하지 않습니다.</p>
        </div>

        <label class="inline option-row">
          <input id="harshFilterEnabled" type="checkbox" checked />
          과한 표현 순화
        </label>
        <p class="helper-text option-helper">욕설이나 날카로운 표현은 덜 세게 다듬고, 핵심 요청은 최대한 유지합니다.</p>

        <div class="actions compose-actions">
          <button id="rewriteBtn" type="button">메세지 다듬기</button>
          <button id="resetBtn" type="button" class="ghost">초기화</button>
          <button id="copyBtn" type="button" class="ghost">결과 복사</button>
        </div>

        <label for="rewrittenText">변환 문자</label>
        <textarea id="rewrittenText" rows="7" readonly></textarea>
      </section>

      <p id="status" class="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
