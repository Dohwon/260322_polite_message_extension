<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polite Rewriter</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="wrap">
      <header>
        <h1>Polite Rewriter</h1>
        <p class="sub">Google 로그인 후 일일 무료 5회(계정/IP 기준) 사용 가능한 버전입니다.</p>
      </header>

      <section class="card auth-card">
        <label>계정</label>
        <p id="accountSummary" class="sub">Google 계정으로 로그인하면 백엔드에 회원으로 등록됩니다.</p>
        <p id="authStatus" class="mini-status"></p>
        <div class="actions">
          <button id="googleLoginBtn" type="button">Google로 시작</button>
          <button id="logoutBtn" type="button" class="ghost">로그아웃</button>
        </div>
      </section>

      <section class="card plans-card">
        <div class="label-row">
          <label>요금제</label>
          <button id="plansInfoBtn" type="button" class="icon-btn" title="요금제 정책 보기">?</button>
        </div>
        <p id="planSummary" class="sub">Free 일일 제한: 계정 5회 + IP 5회 / PRO / Business / 10회 추가는 준비중</p>
        <div class="actions secondary">
          <button id="proBtn" type="button" class="ghost">PRO</button>
          <button id="businessBtn" type="button" class="ghost">Business</button>
        </div>
        <div class="actions secondary">
          <button id="topupBtn" type="button" class="ghost">10회 추가</button>
        </div>
        <div class="plans-overlay" aria-hidden="true">
          <strong>준비중</strong>
          <span>PRO / Business / 10회 추가 기능은 곧 오픈됩니다.</span>
        </div>
      </section>

      <section class="card">
        <label for="tone">분위기</label>
        <select id="tone">
          <option>보통</option>
          <option>친근하게</option>
          <option selected>정중하게</option>
          <option>아주 정중하게</option>
          <option>캐주얼하게</option>
          <option>공손하지만 단호하게</option>
          <option>미안함</option>
          <option>제안함</option>
          <option>사랑함</option>
        </select>

        <label for="recipient">보내는 대상</label>
        <select id="recipient">
          <option>상사</option>
          <option>동료</option>
          <option>친구</option>
          <option>학부모</option>
          <option>고객</option>
          <option>거래처</option>
          <option>연인</option>
          <option>가족</option>
          <option selected>기타</option>
        </select>

        <label for="senderRole">본인 역할</label>
        <input id="senderRole" type="text" placeholder="예: 팀원, 자녀 보호자, 담임교사" />

        <label for="originalText">원본 문자</label>
        <textarea id="originalText" rows="6" placeholder="정중하게 바꾸고 싶은 원본 문장을 입력하세요"></textarea>
        <p id="originalTextError" class="field-error"></p>

        <div class="actions compose-actions">
          <button id="rewriteBtn" type="button">정중하게 다듬기</button>
          <button id="resetBtn" type="button" class="ghost">초기화</button>
          <button id="copyBtn" type="button" class="ghost">복사</button>
        </div>

        <label for="rewrittenText">변환 문자</label>
        <textarea id="rewrittenText" rows="7" readonly></textarea>
      </section>

      <p id="status" class="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
