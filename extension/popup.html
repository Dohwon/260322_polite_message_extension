<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polite Rewriter</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="wrap">
      <header>
        <h1>Polite Rewriter</h1>
        <p class="sub">처음 가입 시 무료 5회가 자동 제공됩니다.</p>
      </header>

      <section class="card auth-card">
        <div class="actions">
          <button id="googleLoginBtn" type="button">Google로 로그인</button>
        </div>
        <p id="authStatus" class="mini-status"></p>

        <div class="actions" id="logoutWrap">
          <button id="logoutBtn" type="button" class="ghost">로그아웃</button>
        </div>
      </section>

      <section class="card">
        <label for="tone">분위기</label>
        <select id="tone">
          <option>친근하게</option>
          <option selected>정중하게</option>
          <option>아주 정중하게</option>
          <option>캐주얼하게</option>
          <option>공손하지만 단호하게</option>
        </select>

        <label for="recipient">보내는 대상</label>
        <select id="recipient">
          <option>상사</option>
          <option>동료</option>
          <option>친구</option>
          <option>학부모</option>
          <option>고객</option>
          <option>거래처</option>
          <option>연인</option>
          <option>가족</option>
          <option selected>기타</option>
        </select>

        <label for="senderRole">본인 역할</label>
        <input id="senderRole" type="text" placeholder="예: 담임교사" />

        <label for="originalText">원본 문자</label>
        <textarea id="originalText" rows="6" placeholder="여기에 원본 문장을 입력하세요"></textarea>
        <p id="originalTextError" class="field-error"></p>

        <div class="actions">
          <button id="rewriteBtn" type="button">변환하기</button>
          <button id="copyBtn" type="button" class="ghost">복사</button>
        </div>

        <label for="rewrittenText">변환 문자</label>
        <textarea id="rewrittenText" rows="7" readonly></textarea>
      </section>

      <p id="status" class="status"></p>

      <section class="card plans-card">
        <div class="actions secondary">
          <button id="proBtn" type="button" class="ghost">Pro 구독</button>
          <button id="businessBtn" type="button" class="ghost">Business 구독</button>
          <button id="topupBtn" type="button" class="ghost">+10회 충전</button>
        </div>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
